[package]
name = "agent-bridge"
version = "0.1.0"
edition = "2024"
description = "Connect applications to installed AI agents"

[features]
default = []
records = ["dep:serde_json"]
sqlite = ["records", "dep:rusqlite", "dep:serde"]
acp = ["records", "dep:serde", "dep:agent-client-protocol", "dep:tokio"]
providers = ["acp", "tokio/process", "tokio/io-util"]

[dependencies]
agent-client-protocol = { version = "2.1.0", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "acp_connect"
required-features = ["acp"]

[[example]]
name = "acp_chat"
required-features = ["acp"]

[[example]]
name = "sqlite_history"
required-features = ["sqlite"]

[[example]]
name = "acp_resume"
required-features = ["acp", "sqlite"]

[[example]]
name = "acp_models"
required-features = ["acp", "sqlite"]

[[example]]
name = "providers"
required-features = ["providers"]
