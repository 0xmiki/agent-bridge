name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: cargo fmt --check
      - run: rustfmt --check --edition 2024 verification/consumer/upgrade.rs
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --no-default-features --features receipts
      - run: cargo check --locked --no-default-features --features dynamic-tools
      - run: cargo test --locked --all-features --all-targets
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo build --locked --features host --bin agent-bridge-host --example rust_integration
      - run: bun install --frozen-lockfile
        working-directory: host
      - run: bun run typecheck
        working-directory: host
      - run: bash verification/consumer/verify.sh
